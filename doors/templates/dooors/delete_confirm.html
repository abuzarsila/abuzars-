{% extends 'dooors/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg rounded-4 p-5">
                <i class="bi bi-exclamation-triangle text-danger display-1 mb-4"></i>
                <h3 class="fw-bold mb-3">Haqiqatan ham o'chirmoqchimisiz?</h3>
                <p class="text-muted mb-5">"{{ door.name }}" mahsuloti butunlay o'chib ketadi.</p>
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger rounded-pill px-5 py-2 fw-bold mb-3 w-100 shadow">Ha, o'chirilsin</button>
                    <a href="{% url 'my_doors' %}" class="btn btn-light rounded-pill px-5 py-2 w-100">Yo'q, qaytish</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
