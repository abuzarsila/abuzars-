{% extends 'dooors/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                <h2 class="fw-bold text-center mb-4">Xush kelibsiz</h2>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Login</label>
                        <input type="text" name="username" class="form-control rounded-pill py-2 px-3">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Parol</label>
                        <input type="password" name="password" class="form-control rounded-pill py-2 px-3">
                    </div>
                    <button type="submit" class="btn btn-dark w-100 rounded-pill py-3 fw-bold shadow">Kirish</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
