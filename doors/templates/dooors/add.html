{% extends 'dooors/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="card border-0 shadow rounded-4 p-4 p-md-5 mx-auto" style="max-width: 800px;">
        <h2 class="fw-bold mb-4 border-bottom pb-3 text-gold">Yangi Mahsulot Qo'shish</h2>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Eshik nomi</label>
                    <input type="text" name="name" class="form-control rounded-3" required placeholder="Masalan: Stil Uberture">
                </div>
                
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Brend</label>
                    <input type="text" name="brand" class="form-control rounded-3" required placeholder="Masalan: Akfa">
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold">Kategoriya</label>
                    <select name="category" class="form-select rounded-3">
                        <option value="Standart">Standart</option>
                        <option value="Premium">Premium</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold">Narxi (UZS)</label>
                    <input type="number" name="price" class="form-control rounded-3" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold">Qoplama</label>
                    <input type="text" name="coating" class="form-control rounded-3" required placeholder="Masalan: PVX">
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold">Tuzilishi</label>
                    <input type="text" name="structure" class="form-control rounded-3" required placeholder="Masalan: MDF">
                </div>

                <div class="col-12">
                    <label class="form-label small fw-bold">Rasm yuklash</label>
                    <input type="file" name="image" class="form-control rounded-3" required>
                </div>

                <div class="col-12">
                    <label class="form-label small fw-bold">Tavsif</label>
                    <textarea name="description" class="form-control rounded-3" rows="4" placeholder="Mahsulot haqida qo'shimcha ma'lumot..."></textarea>
                </div>
            </div>

            <div class="mt-5 d-flex gap-2">
                <button type="submit" class="btn btn-dark px-5 rounded-pill">Saqlash</button>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-5 rounded-pill">Bekor qilish</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
